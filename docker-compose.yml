services:
  postgres:
    image: postgres:16-alpine
    container_name: vibecoding-starter-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: vibecoding_starter
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vibecoding_starter"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vibecoding-starter-redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - redis-data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.0
    container_name: vibecoding-starter-qdrant
    ports:
      - "6333:6333"
    environment:
      QDRANT__SERVICE_API_KEY: ${QDRANT_API_KEY:-qdrant-dev-key}
      QDRANT__SERVICE_STRICT_MODE: ${QDRANT_STRICT_MODE:-true}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\nhost: 127.0.0.1\\r\\n\\r\" >&3 && cat <&3 | grep -q ready'"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - qdrant-data:/qdrant/storage
      - qdrant-snapshots:/qdrant/snapshots

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: vibecoding-starter-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  qdrant-snapshots:
  minio-data:
