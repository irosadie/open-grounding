[project]
name = "open-grounding-api"
version = "0.1.0"
description = "FastAPI service for open-grounding"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15,<2",
  "asyncpg>=0.30,<1",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pwdlib[argon2]>=0.2,<1",
  "pyjwt>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "fastembed>=0.8.0",
  "pdfminer-six>=20260107",
  "qdrant-client>=1.19.0",
  "openai>=2.53.0",
  "langchain-text-splitters>=1.1.2",
  "redis[asyncio]>=8.1.0",
  "aioboto3>=15.5.0",
  "cryptography>=50.0.0",
  "python-multipart>=0.0.32",
  "jinja2>=3.1.6",
]

[project.optional-dependencies]
# Document parsing (docling) is an optional heavy dependency used by the
# ingestion worker. Install with: uv sync --extra parsing
# It pulls PyTorch + layout models (~GBs). The DoclingParserAdapter uses
# lazy imports so the API runs without it installed.
parsing = [
  "docling>=2.118.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app"]
exclude = ["alembic"]
